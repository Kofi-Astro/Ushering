backend:
  name: github
  repo: Kofi-Astro/Ushering
  branch: master
  # The GitHub OAuth proxy that makes this login flow work lives in
  # app/routers/oauth.py, part of the same FastAPI service that runs the
  # /admin booking dashboard and serves this whole site. Update this once
  # that service has a real public URL (see .env.example for the OAuth app
  # setup steps).
  base_url: https://REPLACE-WITH-RAILWAY-BACKEND-URL

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Icon (Font Awesome class, e.g. fa-solid fa-rings-wedding)", name: "icon", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Short Description (used on Home page)", name: "homeDescription", widget: "text" }
      - { label: "Full Description (used on Services page)", name: "description", widget: "text" }
      - { label: "Highlights", name: "highlights", widget: "list" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client Name", name: "name", widget: "string" }
      - { label: "Role / Event", name: "role", widget: "string" }
      - { label: "Rating (1-5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Quote", name: "body", widget: "text" }

  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Caption / Label", name: "label", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["weddings", "corporate", "funerals", "conferences", "parties"] }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Photo", name: "image", widget: "image", required: false }

  - name: "faq"
    label: "FAQ"
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Answer", name: "body", widget: "text" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "content/settings.json"
        fields:
          - { label: "Business Name", name: "site_name", widget: "string" }
          - { label: "Website URL", name: "site_url", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone (display format)", name: "phone_display", widget: "string" }
          - { label: "WhatsApp Number (digits only, with country code, e.g. 233241234567)", name: "whatsapp_number", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address / Location", name: "address", widget: "string" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "TikTok URL", name: "tiktok_url", widget: "string" }
