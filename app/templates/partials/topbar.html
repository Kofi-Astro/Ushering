<div class="topbar">
  <div class="container">
    <div class="topbar-contacts">
      <span><i class="fas fa-phone"></i> <a href="tel:{{ settings.phone_display | replace(' ', '') }}">{{ settings.phone_display }}</a></span>
      <span><i class="fas fa-envelope"></i> <a href="mailto:{{ settings.email }}">{{ settings.email }}</a></span>
      <span><i class="fas fa-location-dot"></i> <a href="https://www.google.com/maps/search/?api=1&query={{ settings.address | urlencode }}" target="_blank" rel="noopener">{{ settings.address }}</a></span>
    </div>
    <div class="topbar-social">
      <a href="{{ settings.facebook_url }}" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="{{ settings.instagram_url }}" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="{{ settings.tiktok_url }}" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
    </div>
  </div>
</div>
