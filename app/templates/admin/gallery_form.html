{% extends "admin/base.html" %}
{% block content %}
<div class="section-toolbar">
  <h2>{{ 'Edit Photo' if item else 'Add Photo' }}</h2>
  <a href="/gallery" class="btn-secondary">Back to Gallery</a>
</div>

<div class="form-card">
  <form method="post" action="{{ ('/gallery/' ~ item.id ~ '/edit') if item else '/gallery/new' }}" enctype="multipart/form-data">
    <div class="field">
      <label for="label">Caption / Label</label>
      <input type="text" id="label" name="label" value="{{ item.label if item else '' }}" required>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        {% for c in categories %}
        <option value="{{ c }}" {{ 'selected' if item and item.category == c }}>{{ c|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="order">Display Order</label>
      <input type="number" id="order" name="order" value="{{ item.order if item else 1 }}" min="1" required>
    </div>
    <div class="field">
      {% if item and item.image %}
      <div class="current-image"><img src="{{ item.image }}" alt="{{ item.label }}"></div>
      {% endif %}
      <label for="photo">{{ 'Replace Photo' if item and item.image else 'Photo' }}</label>
      <input type="file" id="photo" name="photo" accept="image/*">
      <p class="hint">JPG, PNG, WebP or GIF. Leave empty to keep the current photo.</p>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Photo</button>
    </div>
  </form>
</div>
{% endblock %}
