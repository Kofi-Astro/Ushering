<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | GPS Ushering and Events</title>
<link rel="icon" href="/images/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-mark"><img class="logo-mark" src="/images/logo-mark.png" alt="GPS Ushering and Events"></div>
    <span class="login-eyebrow">Site Administration</span>
    <h1>GPS Ushering <span class="accent">&amp; Events</span></h1>
    <p class="subtitle">Sign in to manage bookings, services, gallery and more.</p>
    <form method="post" action="/login">
      {% if error %}<p class="error"><i class="fas fa-circle-exclamation"></i> {{ error }}</p>{% endif %}
      {% if reset %}<p class="success"><i class="fas fa-circle-check"></i> Your password has been changed. Log in with your new password.</p>{% endif %}
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit">Log In</button>
    </form>
    <a href="/forgot-password" class="forgot-link">Forgot your password?</a>
  </div>
</body>
</html>
