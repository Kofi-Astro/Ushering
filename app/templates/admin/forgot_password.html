<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Forgot Password | GPS Ushering and Events</title>
<link rel="icon" href="/images/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-mark"><img class="logo-mark" src="/images/logo-mark.png" alt="GPS Ushering and Events"></div>
    <span class="login-eyebrow">Site Administration</span>
    <h1>Forgot Password<span class="accent">?</span></h1>

    {% if sent %}
    <p class="subtitle">If email is set up for this site, a reset link is on its way to the business's own inbox. It's valid for 1 hour.</p>
    <a href="/login" class="forgot-link">Back to Login</a>
    {% else %}
    <p class="subtitle">We'll send a reset link to this site's own admin email address.</p>
    <form method="post" action="/forgot-password">
      <button type="submit">Send Reset Link</button>
    </form>
    <a href="/login" class="forgot-link">Back to Login</a>
    {% endif %}
  </div>
</body>
</html>
