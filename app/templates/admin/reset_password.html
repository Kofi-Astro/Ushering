<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reset Password | GPS Ushering and Events</title>
<link rel="icon" href="/images/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-mark"><img class="logo-mark" src="/images/logo-mark.png" alt="GPS Ushering and Events"></div>
    <span class="login-eyebrow">Site Administration</span>
    <h1>Reset Password</h1>

    {% if not valid %}
    <p class="subtitle">This reset link is invalid or has expired.</p>
    {% if error %}<p class="error"><i class="fas fa-circle-exclamation"></i> {{ error }}</p>{% endif %}
    <a href="/forgot-password" class="forgot-link">Request a New Link</a>
    {% else %}
    <p class="subtitle">Choose a new password below.</p>
    <form method="post" action="/reset-password/{{ token }}">
      {% if error %}<p class="error"><i class="fas fa-circle-exclamation"></i> {{ error }}</p>{% endif %}
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" required minlength="8" autofocus autocomplete="new-password">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
      <button type="submit">Set New Password</button>
    </form>
    <a href="/login" class="forgot-link">Back to Login</a>
    {% endif %}
  </div>
</body>
</html>
